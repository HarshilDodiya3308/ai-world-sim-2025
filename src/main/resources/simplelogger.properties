# Logging Configuration
# SLF4J Simple Logger

# Set root logger level
org.slf4j.simpleLogger.defaultLogLevel=INFO

# Package specific levels
org.slf4j.simpleLogger.log.com.aiworldsimulation=INFO
org.slf4j.simpleLogger.log.com.aiworldsimulation.ai=DEBUG
org.slf4j.simpleLogger.log.com.aiworldsimulation.simulation=INFO
org.slf4j.simpleLogger.log.com.aiworldsimulation.database=WARN

# Show date and time
org.slf4j.simpleLogger.showDateTime=false

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show log level
org.slf4j.simpleLogger.showLogName=true

# Show short log name
org.slf4j.simpleLogger.showShortLogName=false
